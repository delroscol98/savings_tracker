name: ci

on:
  pull_request:
    branches: [main]

jobs:
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collindelrosario
          POSTGRES_DB: savings_tracker_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup environment variables
        run: echo "DB_URL_TEST=postgres://collindelrosario:@localhost:5432/savings_tracker_test?sslmode=disable" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.5"

      - name: Run backend Go tests
        run: |
          cd backend
          go test ./...

  backend_format_check:
    name: Backend Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Format Go code
        run: (test -z $(go fmt ./...))

      - name: Install staticcheck
        run: (go install honnef.co/go/tools/cmd/staticcheck@latest)

      - name: Run staticcheck
        run: (cd backend && staticcheck ./...)

  frontend_build_test:
    name: Frontend Build Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint

      - name: Run Formatting
        run: npm run format:check

      # - name: Run Tests
      #   run: npm test

      - name: Build Project
        run: npm run build
